services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
    volumes:
      - taskscheduler_pgdata:/var/lib/postresql/data
  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672'
      - '15672'
    volumes:
      - taskscheduler_rabbitmq_data:/var/lib/rabbitmq
volumes:
  taskscheduler_pgdata: 
  taskscheduler_rabbitmq_data: 
